<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinFlow — {{ error_code }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/finflow.css') }}?v=20260923-2"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #e7f0fb;
            background:
                radial-gradient(
                    circle at 50% 18%,
                    rgba(37, 99, 235, .16),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 15% 85%,
                    rgba(34, 211, 238, .07),
                    transparent 28%
                ),
                #050c16;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    120deg,
                    transparent 0%,
                    rgba(255,255,255,.018) 50%,
                    transparent 100%
                );
            opacity: .8;
        }

        .error-shell {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .error-wrap {
            width: min(100%, 620px);
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            color: #dbeafe;
            text-decoration: none;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            border: 1px solid rgba(96,165,250,.22);
            background:
                linear-gradient(
                    145deg,
                    rgba(59,130,246,.16),
                    rgba(34,211,238,.05)
                );
            box-shadow:
                0 12px 35px rgba(37,99,235,.12),
                inset 0 1px 0 rgba(255,255,255,.05);
        }

        .brand-mark i {
            font-size: 17px;
            color: #7dd3fc;
        }

        .brand-name {
            margin: 0;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .brand-name span {
            color: #60a5fa;
        }

        .card {
            position: relative;
            overflow: hidden;
            padding: 46px 42px 40px;
            border: 1px solid rgba(148,163,184,.13);
            border-radius: 26px;
            background:
                linear-gradient(
                    145deg,
                    rgba(15,30,48,.86),
                    rgba(7,17,30,.92)
                );
            box-shadow:
                0 32px 90px rgba(0,0,0,.38),
                0 0 70px rgba(37,99,235,.07),
                inset 0 1px 0 rgba(255,255,255,.045);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0 18% auto;
            height: 1px;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(96,165,250,.75),
                    rgba(34,211,238,.35),
                    transparent
                );
        }

        .status-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            border-radius: 21px;
            border: 1px solid rgba(96,165,250,.18);
            background:
                linear-gradient(
                    145deg,
                    rgba(59,130,246,.13),
                    rgba(34,211,238,.045)
                );
            box-shadow:
                0 18px 45px rgba(37,99,235,.12),
                inset 0 1px 0 rgba(255,255,255,.04);
        }

        .status-icon i {
            font-size: 29px;
            color: #7dd3fc;
        }

        .error-code {
            margin: 0;
            font-size: clamp(72px, 15vw, 112px);
            line-height: .9;
            font-weight: 900;
            letter-spacing: -.065em;
            color: #edf6ff;
            text-shadow:
                0 0 50px rgba(96,165,250,.12);
        }

        .error-title {
            margin: 20px 0 0;
            font-size: clamp(22px, 4vw, 29px);
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -.025em;
            color: #eaf3ff;
        }

        .error-message {
            max-width: 480px;
            margin: 14px auto 0;
            color: #8fa4ba;
            font-size: 14px;
            line-height: 1.75;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 32px;
        }

        .action {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 0 17px;
            border-radius: 12px;
            border: 1px solid transparent;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            transition:
                transform .18s ease,
                border-color .18s ease,
                background .18s ease,
                color .18s ease,
                box-shadow .18s ease;
        }

        .action:hover {
            transform: translateY(-1px);
        }

        .action-primary {
            color: #06101c;
            background:
                linear-gradient(
                    135deg,
                    #60a5fa,
                    #38bdf8
                );
            box-shadow:
                0 10px 30px rgba(37,99,235,.18);
        }

        .action-primary:hover {
            box-shadow:
                0 14px 35px rgba(37,99,235,.25);
        }

        .action-secondary {
            color: #9fb1c5;
            border-color: rgba(148,163,184,.13);
            background: rgba(8,18,31,.58);
        }

        .action-secondary:hover {
            color: #e5effa;
            border-color: rgba(148,163,184,.23);
            background: rgba(15,30,48,.72);
        }

        .security-note {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            color: #60758c;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .security-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 12px rgba(52,211,153,.45);
        }

        .footer {
            margin-top: 22px;
            color: #43566b;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        @media (max-width: 560px) {
            .error-shell {
                padding: 22px 14px;
            }

            .card {
                padding: 38px 22px 32px;
                border-radius: 22px;
            }

            .status-icon {
                width: 64px;
                height: 64px;
                margin-bottom: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .action {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<main class="error-shell">
    <div class="error-wrap">

        <div class="brand" aria-label="FinFlow">
            <span class="brand-mark">
                <i class="bi bi-grid-1x2-fill"></i>
            </span>

            <span class="brand-name">
                Fin<span>Flow</span>
            </span>
        </div>

        <section class="card" aria-labelledby="error-title">

            <div class="status-icon">
                <i class="bi bi-shield-lock"></i>
            </div>

            <p class="error-code">{{ error_code }}</p>

            <h1 id="error-title" class="error-title">
                {{ error_title }}
            </h1>

            <p class="error-message">
                {{ error_message }}
            </p>

            <div class="actions">

                <a
                    href="{{ url_for('index') }}"
                    class="action action-primary"
                >
                    <i class="bi bi-grid-1x2-fill"></i>
                    Back to Dashboard
                </a>

                <a
                    href="{{ url_for('logout') }}"
                    onclick="event.preventDefault(); document.getElementById('error-logout').submit();"
                    class="action action-secondary"
                >
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>

            </div>

            <div class="security-note">
                <span class="security-dot"></span>
                FinFlow system access
            </div>

        </section>

        <footer class="footer">
            Financial management system
        </footer>

        <form
            id="error-logout"
            method="post"
            action="{{ url_for('logout') }}"
            hidden
        >
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >
        </form>

    </div>
</main>

</body>
</html>
