<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinFlow — {{ error_code }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="min-h-screen bg-[#07111f] text-slate-100 flex items-center justify-center px-6">

    <div class="w-full max-w-lg text-center">

        <div class="mx-auto mb-6 w-16 h-16 rounded-2xl bg-emerald-400/10 border border-emerald-400/20 flex items-center justify-center">
            <i class="bi bi-shield-lock text-2xl text-emerald-300"></i>
        </div>

        <div class="text-6xl font-black tracking-tight text-slate-200">
            {{ error_code }}
        </div>

        <h1 class="mt-4 text-2xl font-black">
            {{ error_title }}
        </h1>

        <p class="mt-3 text-sm leading-6 text-slate-400">
            {{ error_message }}
        </p>

        <div class="mt-8 flex items-center justify-center gap-3">

            <a
                href="{{ url_for('index') }}"
                class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-400 text-slate-950 text-xs font-black hover:bg-emerald-300 transition"
            >
                <i class="bi bi-arrow-left"></i>
                Back to Dashboard
            </a>

            <a
                href="{{ url_for('logout') }}"
                onclick="event.preventDefault(); document.getElementById('error-logout').submit();"
                class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-400 text-xs font-black hover:border-rose-400/40 hover:text-rose-300 transition"
            >
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

        <form id="error-logout" method="post" action="{{ url_for('logout') }}" class="hidden">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"></form>

    </div>

</body>
</html>
